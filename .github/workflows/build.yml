name: Build, test, and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # SEC-2026-006: Windows wheel consumption is not affected by the
          # macOS source-distribution Unicode exclusion bypass. Registry and
          # expiry validation below prevents this narrow allowlist from drifting.
          allow-ghsas: GHSA-h35f-9h28-mq5c

  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath ./Directory.Build.props -Raw
          $version = $props.SelectSingleNode(
            "/Project/PropertyGroup/VersionPrefix").InnerText.Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $expectedTag."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.422"
          cache: true
          cache-dependency-path: |
            packages.lock.json
            tests/Speak.Tests/packages.lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Scan tracked files for secrets and personal paths
        shell: pwsh
        run: ./packaging/verify-repository.ps1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj|publish-output|stage|artifacts)[\\/]' } |
            ForEach-Object {
              [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
            }

      - name: Compile Python worker source
        shell: pwsh
        run: |
          python -m compileall -q tools
          if ($LASTEXITCODE -ne 0) { throw "Python syntax validation failed." }

      - name: Test Python worker security contracts
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v

      - name: Validate temporary security exceptions
        run: python tools/validate_security_exceptions.py

      - name: Resolve complete Python lock graphs
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          if ($LASTEXITCODE -ne 0) { throw "Could not install the pinned dependency resolver." }
          uv venv .dependency-check-venv --python 3.11
          if ($LASTEXITCODE -ne 0) { throw "Could not create the dependency-check environment." }
          $python = ".dependency-check-venv/Scripts/python.exe"
          foreach ($lock in @(
            "tools/requirements-whisper-cu126.lock.txt",
            "tools/requirements-qwen-tts-cu126.lock.txt"
          )) {
            uv pip install --dry-run --python $python `
              --index-strategy unsafe-best-match `
              -r $lock
            if ($LASTEXITCODE -ne 0) {
              throw "Dependency resolution failed for $lock."
            }
          }

      - name: Audit Python dependency pins
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { throw "Could not install the pinned Python auditor." }
          python -m pip_audit `
            -r tools/requirements-whisper-cu126.lock.txt `
            --no-deps --disable-pip --progress-spinner off
          if ($LASTEXITCODE -ne 0) { throw "Whisper dependency audit failed." }
          # Temporary, expiry-enforced exceptions are defined in
          # tools/security-exceptions.json and validated earlier in this job.
          # Every unlisted advisory still fails the build.
          python -m pip_audit `
            -r tools/requirements-qwen-tts-cu126.lock.txt `
            --no-deps --disable-pip --progress-spinner off `
            --ignore-vuln PYSEC-2025-217 `
            --ignore-vuln PYSEC-2026-2288 `
            --ignore-vuln PYSEC-2026-2289 `
            --ignore-vuln PYSEC-2026-2290 `
            --ignore-vuln PYSEC-2026-3447
          if ($LASTEXITCODE -ne 0) { throw "Qwen dependency audit failed." }

      - name: Restore locked dependencies
        run: dotnet restore Speak.sln --locked-mode

      - name: Check NuGet advisories
        run: dotnet list Speak.sln package --include-transitive --vulnerable

      - name: Build
        run: dotnet build Speak.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/Speak.Tests/Speak.Tests.csproj
          -c Release
          --no-build
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Enforce coverage floor
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml -File)
          if ($reports.Count -ne 1) {
            throw "Expected exactly one Cobertura report, found $($reports.Count)."
          }
          [xml]$coverage = Get-Content -LiteralPath $reports[0].FullName -Raw
          $lineRate = [double]$coverage.coverage.'line-rate'
          $branchRate = [double]$coverage.coverage.'branch-rate'
          if ($lineRate -lt 0.11) {
            throw "Line coverage $lineRate is below the 11% release floor."
          }
          if ($branchRate -lt 0.09) {
            throw "Branch coverage $branchRate is below the 9% release floor."
          }
          Write-Host "Coverage gate passed: line=$lineRate branch=$branchRate"

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $innoVersion = "6.7.1"
          choco install innosetup `
            --version=$innoVersion `
            --allow-downgrade `
            --no-progress `
            --limit-output `
            --yes
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install Inno Setup $innoVersion."
          }

          $iscc = Get-Item `
            -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            -ErrorAction Stop
          "ISCC_PATH=$($iscc.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify release assets through canonical packaging
        shell: pwsh
        run: >-
          ./packaging/build-packages.ps1
          -NoRestore
          -IsccPath "$env:ISCC_PATH"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Speak-release-assets
          path: packaging/artifacts/
          if-no-files-found: error
          retention-days: 14

  attest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Speak-release-assets
          path: release-artifact

      - name: Revalidate checksums before attestation
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath ./Directory.Build.props -Raw
          $version = $props.SelectSingleNode(
            "/Project/PropertyGroup/VersionPrefix").InnerText.Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version."
          }
          ./packaging/verify-release-assets.ps1 `
            -ArtifactsRoot ./release-artifact `
            -Version $version

      - name: Attest verified release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            release-artifact/Speak-*-Setup.exe
            release-artifact/Speak-*-win-x64-portable.zip
            release-artifact/Speak-*.spdx.json
            release-artifact/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Speak-release-assets
          path: release-artifact

      - name: Revalidate tag, asset set, and SHA-256 hashes
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath ./Directory.Build.props -Raw
          $version = $props.SelectSingleNode(
            "/Project/PropertyGroup/VersionPrefix").InnerText.Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version."
          }
          ./packaging/verify-release-assets.ps1 `
            -ArtifactsRoot ./release-artifact `
            -Version $version

      - name: Create GitHub release from verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content -LiteralPath ./Directory.Build.props -Raw
          $version = $props.SelectSingleNode(
            "/Project/PropertyGroup/VersionPrefix").InnerText.Trim()
          $assets = @(
            "./release-artifact/Speak-$version-Setup.exe",
            "./release-artifact/Speak-$version-win-x64-portable.zip",
            "./release-artifact/Speak-$version.spdx.json",
            "./release-artifact/SHA256SUMS.txt"
          )
          gh release create "$env:GITHUB_REF_NAME" $assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --verify-tag `
            --generate-notes `
            --title "Speak $env:GITHUB_REF_NAME"
